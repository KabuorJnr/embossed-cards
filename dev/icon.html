<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}
.box{width:512px;height:512px;display:grid;place-items:center;background:#ffffff}
.box img{width:var(--k);height:var(--k)}</style></head>
<body><div class="box"><img src="../public/favicon.svg" alt=""></div>
